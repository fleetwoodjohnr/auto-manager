[package]
name = "auto-manager"
description = "Automotive information, inventory and service management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "auto_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
auto-manager-core.workspace = true
auto-manager-obd.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Only v2 updater artifacts are published; no legacy zip extraction.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only to switch on camera access for VIN scanning (the same version Tauri uses).
webkit2gtk = "=2.0.2"

[lints]
workspace = true
