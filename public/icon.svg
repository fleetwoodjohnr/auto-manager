<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon (Simple Suite family: tile, sheen, lifted white card, one bold glyph).
       Regenerate every size with: npm run icons -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8cf"/>
      <stop offset=".5" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e3f3f6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb0c8"/>
      <stop offset="1" stop-color="#0b5468"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="b"/>
      <feOffset in="b" dy="32" result="o"/>
      <feFlood flood-color="#06323f" flood-opacity=".45"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <rect x="224" y="232" width="576" height="560" rx="52" fill="url(#paper)" filter="url(#lift)"/>
  <!-- a steering wheel: rim, hub and three spokes -->
  <g fill="none" stroke="url(#ink)" stroke-linecap="round">
    <circle cx="512" cy="512" r="186" stroke-width="58"/>
    <path d="M338 486H448M576 486H686M512 560V690" stroke-width="54"/>
  </g>
  <circle cx="512" cy="500" r="62" fill="url(#ink)"/>
</svg>
