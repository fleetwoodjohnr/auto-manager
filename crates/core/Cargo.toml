[package]
name = "auto-manager-core"
description = "Auto Manager domain logic: database, VIN decoding, fitment, inventory, pricing, providers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.42", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
csv = "1.4"
quick-xml = "0.42"
strsim = "0.11"
regex = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
rust_xlsxwriter = "0.102"
calamine = "0.38"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
barcoders = { version = "2", features = ["svg"] }
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
flate2 = "1"
# VIN and barcode scanning from photos (pinned: releases at least a few weeks old).
rxing = { version = "=0.9.3", default-features = false, features = ["image", "decoders", "oned", "datamatrix", "qrcode", "pdf417", "multi_barcode_readers", "encoding_rs"] }
ocrs = "=0.13.1"
rten = "=0.26.0"
rten-imageproc = "=0.26.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The OS keyring, for the QuickBooks sign-in (same stores as Simple Connect).
keyring-core = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust D-Bus: no libdbus build dependency.
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[dev-dependencies]
rust_decimal_macros = "1.40"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
