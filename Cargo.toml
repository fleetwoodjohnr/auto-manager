[workspace]
resolver = "3"
members = ["crates/core", "crates/obd", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/fleetwoodjohnr/auto-manager"

[workspace.dependencies]
auto-manager-core = { path = "crates/core" }
auto-manager-obd = { path = "crates/obd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies are optimized in dev/test builds too: image decoding and text recognition are
# unusably slow without it. (Auto Manager's own crates stay quick to rebuild.)
[profile.dev.package."*"]
opt-level = 3
